<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设计台 · 纸偶 · 生生事务所</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #e9dcc0;
        font-family: system-ui, sans-serif;
        color: #4a3a28;
      }
      .card {
        position: fixed;
        padding: 10px 14px;
        border-radius: 3px;
        background: #f6eedb;
        box-shadow: 2px 3px 0 rgba(60, 40, 20, 0.3);
        font-size: 13px;
      }
      #controls {
        left: 16px;
        top: 16px;
        width: 260px;
        max-height: calc(100% - 52px);
        overflow-y: auto;
        display: grid;
        gap: 6px;
      }
      #controls h3 {
        margin: 6px 0 0;
        font-size: 12px;
        font-weight: 600;
        color: #8a6d4a;
      }
      #controls label {
        display: grid;
        grid-template-columns: 54px 1fr 58px;
        align-items: center;
        gap: 6px;
      }
      #controls input[type='range'] {
        accent-color: #2f5d8a;
        width: 100%;
      }
      #controls select {
        font: inherit;
        background: #fbf6ea;
        border: 1px solid #c9b48f;
        border-radius: 3px;
        color: inherit;
      }
      .v {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      button {
        padding: 2px 7px;
        border: 1px solid #b49a74;
        border-radius: 3px;
        background: #fbf6ea;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.on {
        background: #2f5d8a;
        border-color: #2f5d8a;
        color: #f6eedb;
      }
      /* 部件托盘：页签 + 一排卡片 + 现在这张卡的说明。 */
      /* 网格里的子元素默认不比内容窄：一排卡片会把整个面板撑宽、面板被横着滚走。 */
      #controls > * {
        min-width: 0;
      }
      #tray .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #tray .cards {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px 0 2px;
      }
      .pcard {
        flex: 0 0 auto;
        width: 76px;
        min-height: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 4px 3px;
        background: #fbf6ea;
        border: 1px solid #c9b48f;
        border-radius: 3px;
        box-shadow: 1px 2px 0 rgba(60, 40, 20, 0.2);
        font-size: 11px;
        line-height: 1.25;
        text-align: center;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .pcard canvas {
        width: 56px;
        height: 36px;
        pointer-events: none;
      }
      .pcard.on {
        border-color: #2f5d8a;
        box-shadow: inset 0 0 0 1.5px #2f5d8a;
        color: #2f5d8a;
        font-weight: 600;
      }
      .pcard.ghost {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        opacity: 0.92;
        transform: rotate(-5deg);
        box-shadow: 3px 5px 0 rgba(60, 40, 20, 0.3);
      }
      #tray .blurb {
        font-size: 11px;
        color: #7a6248;
        min-height: 2.5em;
        line-height: 1.35;
      }
      #adv summary {
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        color: #8a6d4a;
        padding: 4px 0;
      }
      #adv[open] {
        display: grid;
        gap: 6px;
      }
      .sect {
        display: grid;
        gap: 6px;
      }
      /* 体征的小纸签（挂在纸偶身上）：最重的一个是朱红，其余是墨色。 */
      .sign {
        position: fixed;
        transform: translate(-50%, -50%) rotate(-3deg);
        padding: 2px 8px;
        border: 1px solid #8a6d4a;
        border-radius: 2px;
        background: #f6eedb;
        color: #4a3a28;
        font-size: 12px;
        box-shadow: 1px 2px 0 rgba(60, 40, 20, 0.25);
        z-index: 2;
      }
      .sign.loud {
        background: #d2462e;
        border-color: #a8321f;
        color: #fff6ea;
        font-weight: 600;
      }
      #signCard {
        z-index: 5;
        box-sizing: border-box;
        font-size: 13px;
        line-height: 1.5;
        border-left: 4px solid #8a6d4a;
      }
      #signCard.loud {
        border-left-color: #d2462e;
      }
      #signCard p {
        margin: 6px 0 0;
      }
      #signCard .margin {
        margin-top: 6px;
        font-size: 12px;
        color: #7a6248;
      }
      #signCard[hidden] {
        display: none;
      }
      /* 能量小票（第 4 步 a）：一条米白的收银纸，数字对齐，底边撕开的锯齿；点它收起来。 */
      #receipt {
        z-index: 4;
        box-sizing: border-box;
        padding: 10px 12px 16px;
        border-radius: 0;
        background: #fbf7ec;
        color: #4a3a28;
        font-size: 12px;
        line-height: 1.55;
        cursor: pointer;
        -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 6px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 10px 6px repeat-x;
        mask: linear-gradient(#000 0 0) top / 100% calc(100% - 6px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 10px 6px repeat-x;
      }
      #receipt[hidden] {
        display: none;
      }
      #receipt .rhead {
        text-align: center;
        letter-spacing: 1px;
        color: #7a6248;
        padding-bottom: 4px;
        border-bottom: 1px dashed #b8a27f;
        margin-bottom: 4px;
      }
      #receipt .rrow {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 6px;
        align-items: baseline;
        border-radius: 2px;
        transition: background 0.4s;
      }
      #receipt .rl {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #receipt .rv {
        font-variant-numeric: tabular-nums;
        min-width: 3.2em;
        text-align: right;
      }
      #receipt .rd {
        font-size: 11px;
        color: #2f5d8c;
        font-variant-numeric: tabular-nums;
      }
      #receipt .rrow.moved {
        background: rgba(47, 93, 140, 0.1);
      }
      #receipt .rrow.total {
        font-weight: 600;
      }
      #receipt .rrow.note,
      #receipt .rnote {
        color: #7a6248;
        font-size: 11px;
      }
      #receipt .rrule {
        border-top: 1px dashed #b8a27f;
        margin: 4px 0;
      }
      #receipt.printing .rrow,
      #receipt.printing .rnote,
      #receipt.printing .rrule {
        animation: print 0.18s both;
        animation-delay: calc(var(--i, 0) * 25ms);
      }
      @keyframes print {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      #readout {
        right: 16px;
        bottom: 16px;
        width: 230px;
        line-height: 1.65;
        font-variant-numeric: tabular-nums;
      }
      #readout b {
        font-weight: 600;
      }
      #note {
        right: 16px;
        top: 16px;
        max-width: 300px;
        font-size: 12px;
        color: #7a6248;
        background: #f3e8cf;
      }
      #note:empty {
        display: none;
      }
      /* 抽屉的把手、复位视图：宽屏不用把手。 */
      #sheet {
        display: none;
      }
      #viewReset {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        padding: 6px 12px;
        box-shadow: 2px 3px 0 rgba(60, 40, 20, 0.3);
      }
      #viewReset[hidden] {
        display: none;
      }
      canvas {
        touch-action: none;
      }
      /* 手机（竖屏窄、横屏矮）：参数收进底部的抽屉，读数缩成顶上一条（点开看全部），纸偶站在中间的空地上。 */
      @media (max-width: 719px), (max-height: 499px) {
        .card {
          font-size: 14px;
        }
        #controls {
          left: 0;
          right: 0;
          top: auto;
          bottom: 0;
          width: auto;
          max-height: 52%;
          padding: 0 14px 14px;
          border-radius: 10px 10px 0 0;
          box-shadow: 0 -2px 0 rgba(60, 40, 20, 0.25);
          gap: 8px;
        }
        #controls.collapsed {
          overflow: hidden;
          padding-bottom: 0;
        }
        #controls.collapsed > :not(#sheet):not(#tray) {
          display: none;
        }
        /* 手机：托盘一直露在抽屉顶上，卡片一排左右滑；往上拖卡片才是拖到纸偶身上。 */
        #tray .cards {
          flex-wrap: nowrap;
          overflow-x: auto;
          touch-action: pan-x;
          padding-bottom: 6px;
          scrollbar-width: none;
        }
        #tray .tabs button {
          padding: 4px 10px;
        }
        #tray .blurb {
          display: none;
        }
        #sheet {
          display: block;
          position: sticky;
          top: 0;
          z-index: 1;
          margin: 0 -14px;
          padding: 12px 0 10px;
          border: 0;
          border-radius: 10px 10px 0 0;
          background: #f6eedb;
          font-weight: 600;
          color: #8a6d4a;
        }
        #controls label {
          grid-template-columns: 64px 1fr 78px;
          min-height: 36px;
        }
        #controls input[type='range'] {
          height: 28px;
        }
        #controls select {
          padding: 4px;
        }
        button {
          padding: 6px 10px;
        }
        #readout {
          left: 8px;
          right: 8px;
          top: 8px;
          bottom: auto;
          width: auto;
          padding: 6px 10px;
          font-size: 13px;
          line-height: 1.55;
        }
        #readout:not(.open) .more {
          display: none;
        }
        #note {
          left: 8px;
          right: 8px;
          top: auto;
          bottom: 60px;
          max-width: none;
        }
        #controls:not(.collapsed) ~ #note {
          display: none;
        }
      }
      /* 横着拿的手机：屏幕矮，托盘压成一行（页签在左、卡片在右，卡片只写名字）。 */
      @media (max-height: 499px) {
        #sheet {
          padding: 6px 0 4px;
        }
        #tray {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        #tray .tabs {
          flex-wrap: nowrap;
          flex: 0 0 auto;
        }
        #tray .cards {
          flex: 1 1 auto;
          min-width: 0;
          padding: 4px 0;
        }
        .pcard {
          min-height: 32px;
        }
        .pcard canvas {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="controls" class="card"><button id="sheet" type="button"></button></div>
    <div id="readout" class="card"></div>
    <div id="note" class="card"></div>
    <button id="viewReset" type="button" hidden>复位视图</button>
    <div id="signs"></div>
    <div id="signCard" class="card" hidden></div>
    <div id="receipt" class="card" hidden title="点一下收起来"></div>
    <script type="module" src="/src/proto/desk/main.ts"></script>
  </body>
</html>
