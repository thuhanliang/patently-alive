<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>生生事务所</title>
    <style>
      /* 田野笔记：纸色底、墨色字、蓝图蓝的选中状态（配色见 src/render/palette.ts）。 */
      :root { --paper: #f3ede0; --paper-deep: #e8e0cf; --ink: #1f1d1a; --ink-soft: rgba(31, 29, 26, 0.6); --blueprint: #2f5d8a; --vermilion: #d2462e; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 13px/1.45 ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
      #app { position: fixed; left: 0; right: 0; top: 0; bottom: 196px; }
      #app canvas { display: block; touch-action: none; cursor: grab; }
      #app canvas:active { cursor: grabbing; }
      #left { position: fixed; left: 8px; top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; }
      #hud { padding: 6px 10px; background: rgba(243, 237, 224, 0.88); border: 1px solid rgba(31, 29, 26, 0.35); white-space: pre; pointer-events: none; font: 12px/1.45 ui-monospace, monospace; }
      #toolbar { position: fixed; right: 8px; top: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
      .bar { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
      .bar button { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 3px; padding: 3px 10px; cursor: pointer; }
      .bar button:hover { background: var(--paper-deep); }
      .bar button.active { background: var(--blueprint); border-color: var(--blueprint); color: var(--paper); }
      #tool-bar { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
      .bar select, .bar input { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink-soft); border-radius: 3px; padding: 2px 6px; }
      .panel { padding: 6px 8px; background: rgba(243, 237, 224, 0.92); border: 1px solid rgba(31, 29, 26, 0.35); display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
      .panel-title { font-weight: 600; color: var(--blueprint); align-self: flex-start; }
      .panel label { display: inline-flex; align-items: center; gap: 2px; }
      .note { color: var(--ink-soft); font-size: 12px; }
      #captures { max-width: 360px; padding: 6px 10px; background: rgba(243, 237, 224, 0.88); border: 1px solid rgba(31, 29, 26, 0.35); white-space: pre-wrap; font-size: 12px; pointer-events: auto; max-height: calc(100vh - 560px); min-height: 120px; overflow-y: auto; }
      #captures .log-head { color: var(--blueprint); font-weight: 600; margin-top: 4px; }
      #captures select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--ink-soft); border-radius: 3px; }
      .log-row { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: none; border-bottom: 1px dotted rgba(31, 29, 26, 0.25); padding: 1px 0; cursor: pointer; }
      .log-row:hover { background: var(--paper-deep); }
      .log-row.active { color: var(--blueprint); font-weight: 600; }
      #exam-card { position: fixed; left: 384px; top: 8px; max-width: 360px; min-width: 260px; padding: 6px 10px; background: var(--paper); border: 1.5px solid var(--blueprint); font-size: 12px; pointer-events: auto; }
      #exam-card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 4px 0 0; }
      #exam-card dt { color: var(--ink-soft); }
      #exam-card dd { margin: 0; }
      .card-close { position: absolute; right: 4px; top: 2px; font: inherit; background: none; border: none; cursor: pointer; color: var(--ink); font-size: 16px; }
      @media (max-width: 760px) { #captures, #exam-card { display: none !important; } }
      #deaths { max-width: 360px; padding: 6px 10px; background: rgba(243, 237, 224, 0.88); border: 1px solid rgba(31, 29, 26, 0.35); white-space: pre-wrap; pointer-events: none; font-size: 12px; }
      @media (max-width: 760px) { #deaths { display: none; } }
      #status { max-width: 420px; text-align: right; color: var(--vermilion); min-height: 1.4em; }
      #layer-bar { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
      #alert { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 420px; pointer-events: none; }
      .alert-banner { pointer-events: auto; font: inherit; font-weight: 600; color: var(--paper); background: var(--vermilion); border: none; border-radius: 3px; padding: 4px 12px; box-shadow: 0 1px 0 rgba(31, 29, 26, 0.35); }
      .alert-log { padding: 2px 8px; background: rgba(243, 237, 224, 0.88); border: 1px solid rgba(31, 29, 26, 0.25); white-space: pre; font-size: 11px; color: var(--ink-soft); }
      @media (max-width: 760px) { .alert-log { display: none !important; } }
      #modal { position: fixed; inset: 0; background: rgba(31, 29, 26, 0.25); display: flex; align-items: center; justify-content: center; z-index: 10; }
      .modal-card { max-width: 640px; max-height: calc(100vh - 48px); overflow-y: auto; margin: 16px; padding: 14px 18px; background: var(--paper); border: 1.5px solid var(--blueprint); box-shadow: 0 2px 0 rgba(31, 29, 26, 0.3); }
      .modal-card p { margin: 4px 0; }
      .modal-card .bar { margin-top: 10px; }
      .modal-title { font-size: 16px; font-weight: 600; color: var(--blueprint); margin-bottom: 6px; }
      .score-table { display: grid; grid-template-columns: auto 120px 2.5em 1fr; gap: 3px 8px; align-items: center; margin: 6px 0; }
      .score-bar { height: 8px; border: 1px solid var(--ink-soft); background: var(--paper-deep); }
      .score-bar span { display: block; height: 100%; background: var(--blueprint); }
      .score-value { text-align: right; font-variant-numeric: tabular-nums; }
      .quarter-table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
      .quarter-table th, .quarter-table td { padding: 1px 8px; text-align: right; border-bottom: 1px dotted rgba(31, 29, 26, 0.25); }
      @media (max-width: 760px) { .score-table { grid-template-columns: auto 60px 2.5em; } .score-table .note { grid-column: 1 / -1; } }
      #archive { position: fixed; inset: 0; background: rgba(31, 29, 26, 0.25); display: flex; align-items: center; justify-content: center; z-index: 9; }
      .archive-card { position: relative; max-width: 760px; width: calc(100% - 32px); }
      .archive-body { display: flex; gap: 14px; }
      .archive-left { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
      .archive-search { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink-soft); border-radius: 3px; padding: 2px 6px; }
      .archive-list { max-height: 60vh; overflow-y: auto; }
      .archive-entry { flex: 1; min-width: 0; }
      .archive-entry .log-head { color: var(--blueprint); font-weight: 600; margin-top: 8px; }
      .archive-name { font-size: 15px; font-weight: 600; }
      .archive-data { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0; }
      .archive-introduce { margin: 6px 0; padding: 4px 6px; border: 1.5px dashed var(--blueprint); border-radius: 3px; flex-wrap: wrap; }
      .archive-introduce button { color: var(--blueprint); border-color: var(--blueprint); }
      #design { position: fixed; inset: 0; background: rgba(31, 29, 26, 0.25); display: flex; align-items: center; justify-content: center; z-index: 9; }
      .desk-card { position: relative; max-width: 1080px; width: calc(100% - 32px); }
      .desk-body { display: flex; gap: 14px; align-items: flex-start; }
      .desk-left { flex: 0 0 340px; min-width: 0; }
      .desk-controls { flex: 0 0 300px; min-width: 0; }
      .desk-right { flex: 1; min-width: 0; }
      .desk-blueprint { width: 100%; height: 230px; display: block; border: 1px solid rgba(47, 93, 138, 0.35); }
      .desk-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
      .desk-row select, .desk-row input[type='range'] { flex: 1; min-width: 0; }
      .desk-row input:not([type]) { flex: 1; min-width: 0; font: inherit; }
      .desk-label { flex: 0 0 5.5em; color: var(--ink-soft); }
      .desk-blurb { margin: 0 0 4px 5.5em; }
      .desk-card .log-head { color: var(--blueprint); font-weight: 600; margin-top: 8px; }
      .desk-energy-bar { display: flex; height: 12px; border: 1px solid var(--blueprint); margin: 4px 0; }
      .desk-energy-seg { min-width: 1px; }
      .desk-appetite { position: relative; height: 10px; margin: 4px 0 0; border-bottom: 1.5px solid var(--blueprint); }
      .desk-appetite-mid { position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--blueprint); }
      .desk-appetite-marker { position: absolute; top: -2px; width: 3px; height: 14px; margin-left: -1px; background: var(--blueprint); }
      /* 胃口偏大只是提醒，不是警报：不用朱红（朱红同时只给最响的一处警报）。 */
      .desk-warn { color: var(--ink); font-weight: 600; text-decoration: underline wavy var(--blueprint); }
      .desk-appetite-marker.warn { background: var(--ink); width: 5px; margin-left: -2px; }
      .desk-appetite-labels { display: flex; justify-content: space-between; }
      .desk-hint { color: var(--blueprint); }
      @media (max-width: 860px) { .desk-body { flex-direction: column; } .desk-left, .desk-controls, .desk-right { flex: 1 1 auto; width: 100%; } }
      .archive-data dt { color: var(--ink-soft); }
      .archive-data dd { margin: 0; }
      .swatch { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--ink); border-radius: 50%; vertical-align: -1px; }
      @media (max-width: 760px) { .archive-body { flex-direction: column; } .archive-list { max-height: 20vh; } }
      #chart { cursor: pointer; position: fixed; left: 8px; right: 8px; bottom: 8px; height: 180px; width: calc(100% - 16px); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="left">
      <div id="hud"></div>
      <div id="deaths"></div>
      <div id="captures" style="display: none"></div>
    </div>
    <div id="exam-card" style="display: none"></div>
    <div id="alert"></div>
    <div id="modal" style="display: none"></div>
    <div id="archive" style="display: none"></div>
    <div id="design" style="display: none"></div>
    <div id="toolbar">
      <div class="bar" id="office-bar"></div>
      <div class="bar" id="time-bar"></div>
      <div class="bar" id="camera-bar"></div>
      <div id="layer-bar"></div>
      <div id="field-tools"></div>
      <div id="tool-bar"></div>
      <div id="status"></div>
    </div>
    <canvas id="chart"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
