<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>生生事务所 · 灰盒</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2b2b2b; color: #ddd; font: 13px/1.4 ui-monospace, monospace; }
      #app { position: fixed; left: 0; right: 0; top: 0; bottom: 196px; }
      #app canvas { display: block; touch-action: none; cursor: grab; }
      #app canvas:active { cursor: grabbing; }
      #hud { position: fixed; left: 8px; top: 8px; padding: 4px 8px; background: rgba(0, 0, 0, 0.6); white-space: pre; pointer-events: none; }
      #toolbar { position: fixed; right: 8px; top: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
      .bar { display: flex; gap: 4px; }
      .bar button { font: inherit; color: #ddd; background: #444; border: 1px solid #666; padding: 4px 10px; cursor: pointer; }
      .bar button.active { background: #777; color: #fff; }
      #tool-bar { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
      .bar select, .bar input { font: inherit; color: #ddd; background: #333; border: 1px solid #666; padding: 3px 6px; }
      #status { max-width: 420px; text-align: right; color: #f0c0b0; min-height: 1.4em; }
      #chart { position: fixed; left: 8px; right: 8px; bottom: 8px; height: 180px; width: calc(100% - 16px); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="toolbar">
      <div class="bar" id="time-bar"></div>
      <div class="bar" id="camera-bar"></div>
      <div class="bar" id="layer-bar"></div>
      <div id="tool-bar"></div>
      <div id="status"></div>
    </div>
    <canvas id="chart"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
